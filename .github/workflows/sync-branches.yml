# Sync main into develop and staging after every merge to main.
# This keeps all three environments up-to-date automatically.

name: Sync main into develop and staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-develop:
    name: Merge main into develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Create develop branch if not exists
        run: |
          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "Creating develop branch from main"
            git checkout -b develop origin/main
            git push origin develop
          fi

      - name: Merge main into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge origin/main --no-edit --strategy-option=theirs || {
            echo "Merge conflict detected, resolving with theirs strategy"
            git checkout --theirs .
            git add .
            git commit -m "Merge main into develop (auto-resolved conflicts)"
          }
          git push origin develop

  sync-staging:
    name: Merge main into staging
    runs-on: ubuntu-latest
    needs: sync-develop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Create staging branch if not exists
        run: |
          if ! git rev-parse --verify origin/staging >/dev/null 2>&1; then
            echo "Creating staging branch from main"
            git checkout -b staging origin/main
            git push origin staging
          fi

      - name: Merge main into staging
        run: |
          git checkout staging
          git pull origin staging
          git merge origin/main --no-edit --strategy-option=theirs || {
            echo "Merge conflict detected, resolving with theirs strategy"
            git checkout --theirs .
            git add .
            git commit -m "Merge main into staging (auto-resolved conflicts)"
          }
          git push origin staging
