<mat-toolbar color="primary" class="app-header">
  <!-- Menu Toggle Button (Mobile) -->
<div class="left-menu-content">
  <button mat-icon-button (click)="onMenuToggle()"aria-label="Toggle menu">
  <mat-icon>{{ sidenavOpened() ? 'view_sidebar' : 'view_agenda' }}</mat-icon></button>
  <!-- App Logo/Branding -->
  <div class="app-branding" (click)="goToDashboard()">
    <img src="icons/icon-yps.svg" alt="YPS Academy" class="brand-logo" width="32" height="32" />
    <span class="brand-text">YPS Academy</span>
  </div>
</div>

  <span class="spacer"></span>
  <!-- Header Actions -->
  <div class="header-actions">
    <!-- Website Button -->
    <button
      mat-stroked-button
      (click)="goToWebsite()"
      matTooltip="Visit public website"
      class="website-btn desktop-only-action"
    >
      <mat-icon>language</mat-icon>
      <span class="website-label">Website</span>
    </button>

    <!-- Search (placeholder) -->
     <!-- TODO: Implement search functionality later -->
    <!-- <button
      mat-icon-button
      aria-label="Search"
      matTooltip="Search"
    >
      <mat-icon>search</mat-icon>
    </button> -->

    <!-- Theme Toggle -->
    <button
      mat-icon-button
      (click)="toggleTheme()"
      [attr.aria-label]="themeTooltip()"
      [matTooltip]="themeTooltip()"
      class="desktop-only-action"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>

    <!-- Notifications -->
    <button
      mat-icon-button
      aria-label="Notifications"
      matTooltip="Notifications"
      [matMenuTriggerFor]="notifMenu"
      class="desktop-only-action"
    >
      @if (notificationService.unreadCount() > 0) {
        <mat-icon
          [matBadge]="notificationService.unreadCount() > 99 ? '99+' : notificationService.unreadCount()"
          matBadgeColor="warn"
          matBadgeSize="small">
          notifications
        </mat-icon>
      } @else {
        <mat-icon>notifications_none</mat-icon>
      }
    </button>

    <!-- User Menu -->
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      aria-label="User menu"
      matTooltip="User menu"
    >
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- User Menu -->
<mat-menu #userMenu="matMenu">
  <button mat-menu-item class="mobile-only-menu-item" (click)="goToWebsite()">
    <mat-icon>language</mat-icon>
    <span>Website</span>
  </button>
  <button mat-menu-item class="mobile-only-menu-item" (click)="toggleTheme()">
    <mat-icon>{{ themeIcon() }}</mat-icon>
    <span>{{ themeTooltip() }}</span>
  </button>
  <button mat-menu-item class="mobile-only-menu-item" (click)="openNotifications()">
    @if (notificationService.unreadCount() > 0) {
      <mat-icon [matBadge]="notificationService.unreadCount()" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
    } @else {
      <mat-icon>notifications_none</mat-icon>
    }
    <span>Notifications</span>
  </button>
  <mat-divider class="mobile-only-menu-item"></mat-divider>

  @if (currentUser()) {
    <div class="user-menu-header" mat-menu-item disabled>
      <mat-icon>account_circle</mat-icon>
      <span>{{ currentUser()!.name }} ({{ currentUser()!.role }})</span>
    </div>
    <mat-divider></mat-divider>
  }
  <button mat-menu-item>
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>exit_to_app</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>

<!-- Notifications menu -->
<mat-menu #notifMenu="matMenu" class="notif-menu-panel" xPosition="before">
  <div (click)="$event.stopPropagation()">
    <app-notification-panel></app-notification-panel>
  </div>
</mat-menu>
