<div class="fee-receipt-page">
  <div class="page-header">
    <div>
      <h2 class="tertiary-heading">Student Fee Receipt</h2>
      @if (student()) {
        <p>{{ student()!.firstName }} {{ student()!.lastName }} · Roll No: {{ student()!.rollNumber || '-' }} · {{ student()!.email }}</p>
      }
    </div>

    <button mat-stroked-button type="button" (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      Back To Student Details
    </button>
  </div>

  @if (loading()) {
    <app-loading [message]="'Preparing fee receipt...'" />
  } @else if (error()) {
    <app-error-message
      [title]="'Fee Receipt Unavailable'"
      [message]="error()!"
      (retry)="onRetry()"
    />
  } @else if (receiptData()) {
    <app-fee-receipt [receipt]="receiptData()!" />
  }
</div>
