<div class="website-root">
  <app-website-navbar></app-website-navbar>
  <app-announcement-bar></app-announcement-bar>
  <main>
    <app-hero-section id="home"></app-hero-section>
    <app-courses-section id="courses" appRevealOnScroll [revealDelay]="0.02"></app-courses-section>
    <app-faculty-section id="faculty" appRevealOnScroll [revealDelay]="0.04"></app-faculty-section>
    <app-achievements-section id="achievements" appRevealOnScroll [revealDelay]="0.06"></app-achievements-section>
    <app-testimonials-section id="testimonials" appRevealOnScroll [revealDelay]="0.08"></app-testimonials-section>
    <app-gallery-section id="gallery" appRevealOnScroll [revealDelay]="0.1"></app-gallery-section>
    <app-contact-section id="contact" appRevealOnScroll [revealDelay]="0.12"></app-contact-section>
  </main>
  <app-website-footer></app-website-footer>
</div>
