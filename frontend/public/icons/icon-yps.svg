<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="YPS Academy">
  <defs>
    <linearGradient id="ypsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF5A5A" />
      <stop offset="34%"  stop-color="#FF8B5A" />
      <stop offset="68%"  stop-color="#FFA95A" />
      <stop offset="100%" stop-color="#FFD45A" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3d1a10" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#ypsGradient)" />
  <rect x="36" y="36" width="440" height="440" rx="82" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.50)" stroke-width="5" />

  <g filter="url(#softShadow)">
    <text
      x="50%"
      y="46%"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="150"
      font-weight="800"
      letter-spacing="8"
      fill="#ffffff"
    >
      YPS
    </text>

    <text
      x="50%"
      y="68%"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="44"
      font-weight="700"
      letter-spacing="6"
      fill="#ffffff"
      opacity="0.95"
    >
      ACADEMY
    </text>
  </g>
</svg>
