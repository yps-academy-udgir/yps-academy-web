# Render Blueprint — defines backend services for dev and prod
# Docs: https://render.com/docs/blueprint-spec
#
# One-time setup per environment:
#   1. Go to https://render.com → New → Blueprint
#   2. Connect your GitHub repo and select this file
#   3. Render will create two services: yps-backend-dev and yps-backend-prod
#   4. For each service, go to Environment tab and set MONGODB_URI and FRONTEND_URL
#
# MONGODB_URI values:
#   - Dev: mongodb+srv://<user>:<password>@cluster.mongodb.net/yps-academy-dev
#   - Prod: mongodb+srv://<user>:<password>@cluster.mongodb.net/yps-academy-prod
#
# FRONTEND_URL values:
#   - Dev: https://yps-academy-develop.vercel.app
#   - Prod: https://yps-academy.vercel.app

services:
  # ── Development ──────────────────────────────────────────────
  - type: web
    name: yps-backend-dev
    runtime: node
    plan: free
    rootDir: backend
    branch: develop
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: development
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false

  # ── Production ───────────────────────────────────────────────
  - type: web
    name: yps-backend-prod
    runtime: node
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
